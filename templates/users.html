{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>Gerenciar logins</h2>
    <p class="hint">Somente superadm pode criar novos acessos.</p>
    <form action="{{ url_for('users') }}" method="post" class="grid two-cols">
        <div>
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required>
        </div>
        <div>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required>
        </div>
        <div>
            <label for="role">Perfil</label>
            <select id="role" name="role" required>
                <option value="adm">adm</option>
                <option value="superadm">superadm</option>
            </select>
        </div>
        <div class="full-width">
            <button type="submit">Criar login</button>
        </div>
    </form>
</section>

<section class="card">
    <h2>Usuarios cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Perfil</th>
            </tr>
        </thead>
        <tbody>
            {% for row in users_list %}
            <tr>
                <td>{{ row.id }}</td>
                <td>{{ row.username }}</td>
                <td>{{ row.role }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">Nenhum usuario encontrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
